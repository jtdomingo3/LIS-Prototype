<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data:; connect-src *;" />
    <title>LIS Mobile (POC)</title>
    <link rel="stylesheet" href="css/inject.css" />
  </head>
  <body>
    <!-- App shell: embed remote server in an iframe so Settings remain available -->
    <div id="app-shell" style="width:100%; height:100vh; overflow:hidden; position:relative; background:#fff;">
      <!-- splash shown while iframe loads or when offline -->
      <div id="splash" style="position:absolute; left:0; top:0; right:0; bottom:56px; display:flex; align-items:center; justify-content:center; background:#ffffff; z-index:5;">
        <div id="splash-msg" style="text-align:center; color:#666; font-size:16px;">Loading server…</div>
      </div>

      <!-- live remote content (fills area above bottom bar) -->
      <iframe id="remote-frame" src="about:blank" style="position:absolute; left:0; top:0; right:0; bottom:56px; width:100%; height:calc(100% - 56px); border:none; display:none; background:#fff;" ></iframe>

      <!-- Home hero: logo + main open button -->
      <div id="hero" style="position:absolute; left:0; top:0; right:0; bottom:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;">
        <!-- image logo (copy gezyne-logo.png to www/assets/gezyne-logo.png) -->
        <div id="logo-wrap" style="width:140px; height:140px; display:flex; align-items:center; justify-content:center;">
          <img id="app-logo" src="assets/gezyne-logo.png" alt="Gezyne Clinical Lab" style="width:120px; height:120px; object-fit:contain; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.12); background:#fff;" />
        </div>
        <div id="hero-sub" style="margin-top:18px; color:#444; font-size:16px;">Mobile LIS wrapper</div>
        <button id="open-main" class="btn-open" style="margin-top:22px; padding:14px 28px; border-radius:10px; border:none; background:#0f172a; color:#fff; font-size:18px; cursor:pointer;">Open server</button>
        <div id="hero-note" style="margin-top:12px; color:#666; font-size:13px;">Set server in Settings — then tap Open server</div>
      </div>
      <!-- persistent settings FAB (visible even when bottom bar hidden) -->
      <button id="open-settings-fab" aria-label="Settings" style="position:fixed; right:16px; bottom:80px; width:56px; height:56px; border-radius:28px; background:#0f172a; color:#fff; border:none; z-index:30; box-shadow:0 6px 18px rgba(0,0,0,0.18); font-size:22px;">⚙️</button>

      <!-- hidden controls (settings + fallback snapshot) -->
      <div id="settings-panel" style="display:none; position:fixed; left:12px; right:12px; bottom:72px; z-index:9999; padding:12px; border-radius:8px; background:rgba(255,255,255,0.98); box-shadow:0 6px 20px rgba(0,0,0,0.12);">
        <label style="display:block; margin-bottom:8px; font-weight:600; color:#333;">
          Server URL:
          <input id="server-url-input" type="text" placeholder="http://192.168.31.86:3000" style="width:100%; margin-top:6px; padding:8px; border-radius:6px; border:1px solid #ddd;" />
        </label>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="server-url-save">Save server</button>
          <button id="server-url-test">Test connection</button>
          <button id="open-system-browser">Open server</button>
          <button id="server-url-reset-default">Reset to emulator default</button>
          <div id="server-test-result" style="margin-left:12px; color:#666;"></div>
        </div>
      </div>

      <div id="remote-viewer-wrap" style="display:none; position:fixed; left:12px; right:12px; bottom:72px; z-index:9998; padding:12px; background:#fff; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.08); max-height:60vh; overflow:auto;">
        <div id="remote-viewer">No snapshot saved.</div>
      </div>

      <!-- debug log (hidden in production-like UI) -->
      <pre id="debug-log" style="position:fixed; left:12px; right:12px; top:72px; height:120px; overflow:auto; background:rgba(0,0,0,0.03); color:#222; padding:8px; font-size:12px; display:none; z-index:9997; border-radius:6px;">Debug log</pre>

    </div>

    <div id="lis-status-bar" class="lis-offline" aria-hidden="false">
      <div class="lis-status-content">
        <span class="lis-status-dot offline"></span>
        <span class="lis-status-text">Offline — changes will be queued</span>
        <div id="lis-sync-progress-wrap"><div id="lis-sync-progress"></div></div>
        <span id="lis-pending" class="lis-pending-badge">0 pending</span>
        <button class="lis-sync-btn" id="lis-sync-now">Sync now</button>
        <!-- persistent Settings in bottom bar -->
        <button class="lis-sync-btn" id="open-settings-bottom" title="Settings">Settings</button>
      </div>
    </div>

    <script src="cordova.js"></script>
    <script src="https://unpkg.com/localforage/dist/localforage.min.js"></script>
    <script src="js/datastore.js"></script>
    <script src="js/operationQueue.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
