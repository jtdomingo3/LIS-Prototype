<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Preview — Gezyne LIS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1e1e1e; }

    /* ── toolbar ──────────────────────────────────── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .toolbar .title {
      font-weight: 600;
      font-size: 15px;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar .title img {
      height: 24px;
      width: 24px;
      border-radius: 4px;
    }
    .toolbar button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-print {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,.35);
    }
    .btn-print:hover { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    .btn-save {
      background: rgba(255,255,255,.1);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,.15);
    }
    .btn-save:hover { background: rgba(255,255,255,.2); color: #fff; }
    .btn-close {
      background: rgba(239,68,68,.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,.2);
    }
    .btn-close:hover { background: rgba(239,68,68,.3); }

    /* ── PDF viewer area ─────────────────────────── */
    .pdf-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }
    .pdf-container embed,
    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── fallback message ────────────────────────── */
    .fallback {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #94a3b8;
      font-family: 'Segoe UI', sans-serif;
    }
    .fallback h2 { font-size: 20px; margin-bottom: 12px; color: #e2e8f0; }
    .fallback p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="title">
      <span>📄 Print Preview</span>
    </div>
    <button class="btn-save" onclick="savePdf()">💾 Save PDF</button>
    <button class="btn-print" onclick="printPdf()">🖨️ Print</button>
    <button class="btn-close" onclick="window.close()">✕ Close</button>
  </div>

  <!-- PDF display -->
  <div class="pdf-container" id="pdfContainer">
    <div class="fallback" id="fallback">
      <h2>PDF Preview</h2>
      <p>Generating preview…</p>
    </div>
  </div>

  <script>
    // Read the PDF path passed via query string
    const params = new URLSearchParams(window.location.search);
    const pdfPath = params.get('pdf');
    const reportUrl = params.get('reportUrl');

    if (pdfPath && window.lisAppPrint) {
      // Use file:// protocol to load the local PDF
      const fileUrl = 'file:///' + pdfPath.replace(/\\/g, '/');

      // Embed using iframe (Electron's Chromium PDF viewer)
      const container = document.getElementById('pdfContainer');
      const embed = document.createElement('embed');
      embed.src = fileUrl + '#toolbar=1&navpanes=0&scrollbar=1&view=FitH';
      embed.type = 'application/pdf';
      container.insertBefore(embed, container.firstChild);

      // Show fallback if embed fails
      embed.addEventListener('error', () => {
        document.getElementById('fallback').style.display = 'block';
      });
    } else {
      document.getElementById('fallback').style.display = 'block';
    }

    // Toolbar actions — open PDF in the system's default viewer for proper
    // print preview with paper size, margins, borders etc.
    async function printPdf() {
      if (window.lisAppPrint && pdfPath) {
        await window.lisAppPrint.print(pdfPath, reportUrl || '');
      }
    }

    async function savePdf() {
      if (window.lisAppPrint && pdfPath) {
        const result = await window.lisAppPrint.savePdf(pdfPath);
        if (result.success) {
          // Brief visual feedback
          const btn = document.querySelector('.btn-save');
          const orig = btn.textContent;
          btn.textContent = '✓ Saved!';
          setTimeout(() => { btn.textContent = orig; }, 2000);
        }
      }
    }
  </script>
</body>
</html>
