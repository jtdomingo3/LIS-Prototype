<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Preview — Gezyne LIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; font-family: 'Inter', -apple-system, sans-serif; color: #f1f5f9; }

    /* ── toolbar ──────────────────────────────────── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(30, 41, 59, 0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      overflow: visible;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: visible;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .toolbar .title {
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(15, 23, 42, 0.65);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-select, .form-input {
      background: rgba(30, 41, 59, 0.9);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .form-select:focus, .form-input:focus {
      border-color: #3b82f6;
    }
    .form-select option {
      background: #1e293b;
      color: #f1f5f9;
    }

    /* ── Settings Dropdown Popup ─────────────────── */
    .settings-wrapper {
      position: relative;
      flex-shrink: 0;
      overflow: visible;
    }
    .btn-settings {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-settings:hover, .btn-settings.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }
    .btn-settings .arrow {
      font-size: 9px;
      transition: transform 0.2s;
    }
    .btn-settings.active .arrow {
      transform: rotate(180deg);
    }
    
    .settings-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
      width: 270px;
    }
    .settings-menu.open {
      display: flex !important;
      animation: fadeIn .15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .setting-item label {
      font-weight: 500;
      color: #94a3b8;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(15, 23, 42, 0.65);
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .toolbar button {
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .toolbar button:hover { transform: translateY(-1px); }
    
    .btn-print {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 13px !important;
      padding: 7px 18px !important;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
    }
    .btn-print:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-print:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .btn-save {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-save:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    
    .btn-close {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .btn-close:hover { background: rgba(239, 68, 68, 0.3); }
    
    .btn-zoom {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 3px 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-zoom:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    /* ── toast notification ───────────────────────── */
    .toast {
      position: fixed;
      top: 72px;
      right: 20px;
      background: #059669;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 10000;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #dc2626; }

    /* ── pages container (scrollable) ─────────────── */
    .pages {
      position: fixed;
      top: 60px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: #090d16;
    }
    .pages canvas {
      display: block;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-width: 95%;
      transition: transform 0.2s ease;
    }
    .loading {
      color: #94a3b8;
      text-align: center;
      margin-top: 80px;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .error {
      color: #f87171;
      text-align: center;
      margin-top: 80px;
      font-size: 14px;
    }

    /* ── Responsive adjustments ─────────────────── */
    @media (max-width: 760px) {
      .toolbar .title { display: none; }
      .hide-xs { display: none !important; }
    }

    /* ── print styles ────────────────────────────── */
    @media print {
      .toolbar, .loading, .error, .toast, .settings-menu { display: none !important; }
      html, body {
        background: #fff;
        height: auto;
        overflow: visible;
      }
      .pages {
        position: static;
        padding: 0;
        gap: 0;
        overflow: visible;
        display: block;
        background: #fff;
      }
      .pages canvas {
        display: block;
        box-shadow: none;
        max-width: none;
        width: 100% !important;
        height: auto !important;
        page-break-after: always;
        margin: 0;
      }
      .pages canvas:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Responsive Toolbar -->
  <div class="toolbar">
    <!-- Left Section: Title + Printer -->
    <div class="toolbar-left">
      <div class="title">
        <span>📄 Report Preview</span>
      </div>

      <!-- Printer Selection -->
      <div class="control-group">
        <span class="control-label">🖨️</span>
        <select id="printerSelect" class="form-select" style="max-width: 180px;" onchange="saveSetting('printer', this.value)">
          <option value="">Detecting printers…</option>
        </select>
      </div>

      <!-- Paper Size Selection -->
      <div class="control-group hide-xs">
        <select id="paperSelect" class="form-select" onchange="syncPaper(this.value)">
          <option value="Letter">Letter</option>
          <option value="A4">A4</option>
          <option value="Legal">Legal</option>
          <option value="A5">A5</option>
        </select>
      </div>

      <!-- More Print Options Dropdown -->
      <div class="settings-wrapper">
        <button class="btn-settings" id="btnSettingsToggle" onclick="toggleSettingsMenu(event)">
          <span>⚙️ Options</span>
          <span class="arrow">▼</span>
        </button>

        <div class="settings-menu" id="settingsMenu" onclick="event.stopPropagation()">
          <div class="setting-item">
            <label>Paper Size:</label>
            <select id="paperSelectMenu" class="form-select" style="width: 130px;" onchange="syncPaper(this.value)">
              <option value="Letter">Letter (8.5 × 11 in)</option>
              <option value="A4">A4 (210 × 297 mm)</option>
              <option value="Legal">Legal (8.5 × 14 in)</option>
              <option value="A5">A5 (148 × 210 mm)</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Layout:</label>
            <select id="orientationSelect" class="form-select" style="width: 130px;" onchange="saveSetting('orientation', this.value)">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Margins:</label>
            <select id="marginSelect" class="form-select" style="width: 130px;" onchange="saveSetting('margins', this.value)">
              <option value="none">None (Exact)</option>
              <option value="printableArea">Minimum</option>
              <option value="default">Default</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Copies:</label>
            <input type="number" id="copiesInput" value="1" min="1" max="99" class="form-input" style="width: 60px; text-align: center;">
          </div>
          <div class="setting-item">
            <label>Color Mode:</label>
            <select id="colorSelect" class="form-select" style="width: 130px;" onchange="saveSetting('color', this.value)">
              <option value="1">Color</option>
              <option value="0">Grayscale (B&W)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: Pinned Zoom & Action Buttons (ALWAYS VISIBLE) -->
    <div class="toolbar-right">
      <!-- Zoom Controls -->
      <div class="zoom-controls">
        <button class="btn-zoom" onclick="changeZoom(-0.15)" title="Zoom Out">−</button>
        <span id="zoomLabel" style="min-width: 32px; text-align: center; font-size: 11px;">100%</span>
        <button class="btn-zoom" onclick="changeZoom(0.15)" title="Zoom In">+</button>
      </div>

      <!-- Action Buttons -->
      <button class="btn-save" onclick="savePdf()" title="Save PDF"><span>💾</span> <span class="hide-xs">Save</span></button>
      <button class="btn-print" id="btnPrint" onclick="printDoc()"><span>🖨️</span> <span>Print</span></button>
      <button class="btn-close" onclick="closePreview()" title="Close Preview">✕</button>
    </div>
  </div>

  <!-- Rendered PDF pages -->
  <div class="pages" id="pages" onclick="closeSettingsMenu()">
    <div class="loading" id="loading">
      <span>Rendering high-resolution print preview…</span>
    </div>
  </div>

  <!-- pdf.js -->
  <script src="../node_modules/pdfjs-dist/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      '../node_modules/pdfjs-dist/build/pdf.worker.min.js';

    const params  = new URLSearchParams(location.search);
    const pdfPath = params.get('pdf');
    let currentZoom = 1.0;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function toggleSettingsMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('settingsMenu');
      const btn = document.getElementById('btnSettingsToggle');
      if (menu) {
        menu.classList.toggle('open');
        if (btn) btn.classList.toggle('active', menu.classList.contains('open'));
      }
    }

    function closeSettingsMenu() {
      const menu = document.getElementById('settingsMenu');
      const btn = document.getElementById('btnSettingsToggle');
      if (menu) menu.classList.remove('open');
      if (btn) btn.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
      const wrapper = document.querySelector('.settings-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        closeSettingsMenu();
      }
    });

    function syncPaper(val) {
      const p1 = document.getElementById('paperSelect');
      const p2 = document.getElementById('paperSelectMenu');
      if (p1) p1.value = val;
      if (p2) p2.value = val;
      saveSetting('paper', val);
    }

    function updateZoomDisplay() {
      document.getElementById('zoomLabel').textContent = Math.round(currentZoom * 100) + '%';
      const canvases = document.querySelectorAll('#pages canvas');
      canvases.forEach(c => {
        c.style.transform = `scale(${currentZoom})`;
        c.style.transformOrigin = 'top center';
      });
    }

    function changeZoom(delta) {
      currentZoom = Math.max(0.5, Math.min(2.5, currentZoom + delta));
      updateZoomDisplay();
    }

    function resetZoom() {
      currentZoom = 1.0;
      updateZoomDisplay();
    }

    /* ── Settings persistence ───────────────────────────────── */
    function saveSetting(key, val) {
      try { localStorage.setItem('lis_print_' + key, val); } catch (_) {}
    }
    function restoreSettings() {
      try {
        const savedPaper = localStorage.getItem('lis_print_paper');
        if (savedPaper) syncPaper(savedPaper);
        const savedOrient = localStorage.getItem('lis_print_orientation');
        if (savedOrient) document.getElementById('orientationSelect').value = savedOrient;
        const savedMargin = localStorage.getItem('lis_print_margins');
        if (savedMargin) document.getElementById('marginSelect').value = savedMargin;
        const savedColor = localStorage.getItem('lis_print_color');
        if (savedColor) document.getElementById('colorSelect').value = savedColor;
      } catch (_) {}
    }
    restoreSettings();

    /* ── Load system printers into dropdown ─────────────────── */
    async function loadPrinters() {
      const select = document.getElementById('printerSelect');
      if (window.lisAppPrint && typeof window.lisAppPrint.getPrinters === 'function') {
        try {
          const printers = await window.lisAppPrint.getPrinters();
          select.innerHTML = '';
          const savedPrinter = localStorage.getItem('lis_print_printer');
          if (Array.isArray(printers) && printers.length) {
            printers.forEach(p => {
              const opt = document.createElement('option');
              opt.value = p.name;
              opt.textContent = (p.displayName || p.name) + (p.isDefault ? ' (Default)' : '');
              if (savedPrinter && p.name === savedPrinter) {
                opt.selected = true;
              } else if (!savedPrinter && p.isDefault) {
                opt.selected = true;
              }
              select.appendChild(opt);
            });
          } else {
            select.innerHTML = '<option value="">Default System Printer</option>';
          }
        } catch (e) {
          console.warn('loadPrinters error:', e);
          select.innerHTML = '<option value="">Default System Printer</option>';
        }
      } else {
        select.innerHTML = '<option value="">Default System Printer</option>';
      }
    }
    loadPrinters();

    /* ── Render all PDF pages to <canvas> elements ─────────── */
    (async function renderPreview() {
      const container = document.getElementById('pages');
      const loadingEl = document.getElementById('loading');

      if (!pdfPath || !window.lisAppPrint) {
        loadingEl.textContent = 'No PDF report data available.';
        loadingEl.className   = 'error';
        return;
      }

      try {
        const pdfData = await window.lisAppPrint.readPdfFile(pdfPath);
        if (!pdfData) throw new Error('Could not read report file from temporary storage');

        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
        loadingEl.remove();

        for (let i = 1; i <= pdf.numPages; i++) {
          const page     = await pdf.getPage(i);
          const scale    = 2;   // 2x for crisp print output
          const viewport = page.getViewport({ scale });

          const canvas   = document.createElement('canvas');
          canvas.width   = viewport.width;
          canvas.height  = viewport.height;
          canvas.style.aspectRatio = viewport.width + ' / ' + viewport.height;

          container.appendChild(canvas);

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport,
          }).promise;
        }
      } catch (err) {
        console.error('PDF render error:', err);
        loadingEl.textContent = 'Failed to render report preview: ' + err.message;
        loadingEl.className   = 'error';
      }
    })();

    /* ── Print with selected printer, paper size, orientation, and margins ── */
    async function printDoc() {
      closeSettingsMenu();
      const btn = document.getElementById('btnPrint');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Printing…';

      const printerName = document.getElementById('printerSelect').value;
      const pageSize = document.getElementById('paperSelect').value;
      const orientation = document.getElementById('orientationSelect').value;
      const margins = document.getElementById('marginSelect').value;
      const copies = parseInt(document.getElementById('copiesInput').value, 10) || 1;
      const color = document.getElementById('colorSelect').value === '1';

      if (window.lisAppPrint && typeof window.lisAppPrint.printSilent === 'function') {
        const res = await window.lisAppPrint.printSilent({
          printerName,
          pageSize,
          orientation,
          margins,
          copies,
          color
        });
        if (res && res.success) {
          btn.innerHTML = '<span>✓</span> Sent!';
          showToast(`Report sent to ${printerName || 'default printer'} (${pageSize})`);
          setTimeout(() => { btn.innerHTML = origHtml; btn.disabled = false; }, 2500);
        } else {
          btn.innerHTML = '<span>⚠️</span> Error';
          showToast(`Printing failed: ${res && res.failureReason ? res.failureReason : 'Check printer connection'}`, true);
          setTimeout(() => { btn.innerHTML = origHtml; btn.disabled = false; }, 3000);
        }
      } else {
        window.print();
        btn.innerHTML = origHtml;
        btn.disabled = false;
      }
    }

    function closePreview() {
      if (window.lisAppPrint && typeof window.lisAppPrint.close === 'function') {
        window.lisAppPrint.close();
      } else {
        window.close();
      }
    }

    async function savePdf() {
      closeSettingsMenu();
      if (window.lisAppPrint && pdfPath) {
        const result = await window.lisAppPrint.savePdf(pdfPath);
        if (result && result.success) {
          showToast('✓ PDF saved successfully!');
        }
      }
    }
  </script>
</body>
</html>
