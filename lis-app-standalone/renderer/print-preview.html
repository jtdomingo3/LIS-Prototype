<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Preview — Gezyne LIS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #2a2a2a; font-family: 'Segoe UI', Tahoma, sans-serif; }

    /* ── toolbar ──────────────────────────────────── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      color: #e2e8f0;
    }
    .toolbar .title {
      font-weight: 600;
      font-size: 15px;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-print {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,.35);
    }
    .btn-print:hover { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    .btn-save {
      background: rgba(255,255,255,.1);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,.15);
    }
    .btn-save:hover { background: rgba(255,255,255,.2); color: #fff; }
    .btn-close {
      background: rgba(239,68,68,.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,.2);
    }
    .btn-close:hover { background: rgba(239,68,68,.3); }

    /* ── pages container (scrollable) ─────────────── */
    .pages {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .pages canvas {
      display: block;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.5);
      max-width: 90%;
    }
    .loading {
      color: #94a3b8;
      text-align: center;
      margin-top: 60px;
      font-size: 16px;
    }
    .error {
      color: #f87171;
      text-align: center;
      margin-top: 60px;
      font-size: 14px;
    }

    /* ── print styles ────────────────────────────── */
    @media print {
      .toolbar, .loading, .error { display: none !important; }
      html, body {
        background: #fff;
        height: auto;
        overflow: visible;
      }
      .pages {
        position: static;
        padding: 0;
        gap: 0;
        overflow: visible;
        display: block;
      }
      .pages canvas {
        display: block;
        box-shadow: none;
        max-width: none;
        width: 100% !important;
        height: auto !important;
        page-break-after: always;
        margin: 0;
      }
      .pages canvas:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="title">
      <span>📄 Print Preview</span>
    </div>
    <button class="btn-save" onclick="savePdf()">💾 Save PDF</button>
    <button class="btn-print" onclick="printDoc()">🖨️ Print</button>
    <button class="btn-close" onclick="window.close()">✕ Close</button>
  </div>

  <!-- Rendered PDF pages -->
  <div class="pages" id="pages">
    <div class="loading" id="loading">Rendering preview…</div>
  </div>

  <!-- pdf.js — renders PDF pages as canvas elements (HTML, not a plugin) -->
  <script src="../node_modules/pdfjs-dist/build/pdf.min.js"></script>
  <script>
    // Point to the worker file so pdf.js can parse PDFs efficiently
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      '../node_modules/pdfjs-dist/build/pdf.worker.min.js';

    const params  = new URLSearchParams(location.search);
    const pdfPath = params.get('pdf');

    /* ── Render all PDF pages to <canvas> elements ─────────── */
    (async function renderPreview() {
      const container = document.getElementById('pages');
      const loadingEl = document.getElementById('loading');

      if (!pdfPath || !window.lisAppPrint) {
        loadingEl.textContent = 'No PDF data available.';
        loadingEl.className   = 'error';
        return;
      }

      try {
        // Read the PDF binary via IPC (preload is sandboxed, no direct fs access)
        const pdfData = await window.lisAppPrint.readPdfFile(pdfPath);
        if (!pdfData) throw new Error('Could not read PDF file');

        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
        loadingEl.remove();

        for (let i = 1; i <= pdf.numPages; i++) {
          const page     = await pdf.getPage(i);
          const scale    = 2;   // 2x for crisp print output
          const viewport = page.getViewport({ scale });

          const canvas   = document.createElement('canvas');
          canvas.width   = viewport.width;
          canvas.height  = viewport.height;

          // Keep aspect ratio via CSS
          canvas.style.aspectRatio = viewport.width + ' / ' + viewport.height;

          container.appendChild(canvas);

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport,
          }).promise;
        }
      } catch (err) {
        console.error('PDF render error:', err);
        loadingEl.textContent = 'Failed to render preview: ' + err.message;
        loadingEl.className   = 'error';
      }
    })();

    /* ── Toolbar actions ──────────────────────────────────────── */

    /** Print — calls the native print dialog on this HTML page.
     *  Because the content is pure HTML/canvas (not a PDF plugin),
     *  Chromium can generate a proper print preview. */
    function printDoc() {
      window.print();
    }

    /** Save a copy of the PDF to a user-chosen location */
    async function savePdf() {
      if (window.lisAppPrint && pdfPath) {
        const result = await window.lisAppPrint.savePdf(pdfPath);
        if (result && result.success) {
          const btn  = document.querySelector('.btn-save');
          const orig = btn.textContent;
          btn.textContent = '✓ Saved!';
          setTimeout(() => { btn.textContent = orig; }, 2000);
        }
      }
    }
  </script>
</body>
</html>
